[project]
name = "vfc"
version = "0.1.0"
description = "Video fact-checking pipeline: scrape, transcribe, detect checkworthy claims"
authors = [{ name = "Fedor Splitt" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1",
    "faster-whisper>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "transformers>=4.30",
    "torch>=2.0",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
    "requests>=2.28",
    "tavily-python>=0.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vfc = "pipeline:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "config",
    "scraper",
    "transcriber",
    "topic",
    "claim_detector",
    "deduplicator",
    "fact_checker",
    "evidence",
    "reporter",
    "pipeline",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
